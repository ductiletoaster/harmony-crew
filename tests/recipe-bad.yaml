# Malformed recipe — must FAIL recipe-lint with clear errors. Three distinct defects,
# each on its own entry so all three surface independently:
#   1. gitops.module 'argo-cd' is a typo — no tool-argo-cd skill, and unknown module
#   2. memory (module vault-substrate) is missing its required 'mcp' field
#   3. tools.deploy is an out-of-enum role key

identity:
  name: badproj
  repo: example/badproj

tools:
  gitops:
    module: argo-cd          # typo: should be 'argocd'
    endpoint: x
    auth: y
    mcp: argocd

  memory:
    module: vault-substrate  # valid module, but 'mcp' (required) is omitted

  deploy:                    # 'deploy' is not in the role enum
    module: argocd
    endpoint: x
    auth: y
    mcp: argocd
