# Example recipe — Harmony (consumer #1). A project drops its own copy at
# .pi/project.yaml (pi) and mirrors it for Claude Code. See RECIPE.md.

identity:
  name: harmony
  cli: hmy
  repo: ductiletoaster/harmony

tools:
  gateway:
    module: litellm
    endpoint: litellm.nexus.svc.cluster.local:4000
    auth: op://Harmony/LiteLLM/agents_key
    notes: federates the MCP upstreams below; reach them via the <prefix>-* tools

  gitops:
    module: argocd
    endpoint: argocd.lab.pixeloven.com
    auth: op://Harmony/ArgoCD/agent_token
    mcp: argocd            # read-path: argocd-* via the gateway
    notes: read via MCP; sync/rollback via the argocd CLI only; never kubectl apply in prod

  secrets:
    module: external-secrets
    store: onepassword      # ClusterSecretStore name
    prefix: op://Harmony

  memory:
    module: vault-substrate
    mcp: vault              # vault_* tools via the gateway

  media:
    module: comfyui
    mcp: comfyui

  exec:
    module: coder
    endpoint: coder.lab.pixeloven.com
    auth: op://Harmony/Coder/api_token

facts:
  storage_fast: harmony-runtime
  storage_bulk: harmony-storage
  fsGroup: 3000
  tolerations: [ node-role.kubernetes.io/control-plane ]
  runtimes: { default: runc, sandboxed: kata }
  domains: "*.lab.pixeloven.com"

seams:
  - litellm-trust-boundary: LLM-controlled requests crossing the gateway need review
  # … remaining harmony-protected-seams entries …

stack:
  python: { pkg: uv, lint: ruff, test: pytest, layout: src }
  iac:    { tool: terraform, stages: [ stage1-omni, stage2-talos ] }
