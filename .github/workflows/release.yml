name: Release (version bump + tag)

# Keeps the foundation's version honest so consumers tracking `main` actually
# receive updates. Claude Code only re-fetches a plugin when plugin.json's
# `version` changes (commits alone don't ship), so every change merged to main
# must move the version.
#
# On each push to main:
#   - if plugin.json's current version is NOT yet tagged → a PR bumped it
#     manually (a minor/major release); just create the tag.
#   - if it IS already tagged → auto-bump the PATCH and tag the new version.
# Either path leaves plugin.json == package.json == the git tag, so the Claude
# plugin (tracks main) and the pi package (pins the tag) move off one number.
#
# Loop-safe: pushes made with GITHUB_TOKEN don't trigger workflows, and the
# bump commit carries [skip ci] as belt-and-suspenders.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags for the existence check

      - name: Bump (if already released) + tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ver=$(jq -r .version .claude-plugin/plugin.json)
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            # current version already released → auto-bump the patch
            ver=$(echo "$ver" | awk -F. -v OFS=. '{$3++; print}')
            jq --arg v "$ver" '.version=$v' .claude-plugin/plugin.json > tmp && mv tmp .claude-plugin/plugin.json
            jq --arg v "$ver" '.version=$v' package.json > tmp && mv tmp package.json
            git commit -am "chore(release): v$ver [skip ci]"
            git push origin HEAD:main
          fi
          git tag "v$ver"
          git push origin "v$ver"
          echo "Released v$ver"
